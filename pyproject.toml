# 项目依赖声明（uv 管理）
# 2026-09-28 环境结构变更：由 virtualenv + pip 迁移为 uv 托管（.venv 由 uv sync 重建）。
# 依赖版本与原 requirements.txt 一致；2026-09-28 旧 requirements*.txt 四份已删除，
# 本文件 + uv.lock 为唯一依赖声明（历史版本可经 git 回溯）。
# 安装/同步：uv sync    运行：uv run python todolist.py

[project]
name = "python-learn"
version = "0.1.0"
description = "Python Web 全栈学习练习仓库（脚本集合，非打包项目）"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "SQLAlchemy==2.0.52",
    "PyMySQL==1.2.0",
    "alembic==1.20.0",
]

[dependency-groups]
# 开发工具依赖（程序运行不需要），对应原 requirements-dev.txt（已删除）
dev = [
    "pyright==1.1.411",
]

[tool.uv]
# 纯脚本练习仓库，不构建分发包
package = false

[[tool.uv.index]]
# 本机默认 PyPI 源连不上（历史实测，原 requirements.txt 注释，文件已删除），默认走清华镜像
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
